<div class="admin">
  <aside class="admin__sidebar" [class.is-open]="sidebarOpen()">
    <a class="admin__brand" routerLink="/" title="Back to site">
      <span class="admin__brand-mark">S</span>
      <span>
        <strong>Palmo</strong>
        <small>Admin Panel</small>
      </span>
    </a>

    <nav class="admin__nav">
      @for (item of nav; track item.link) {
        <a
          [routerLink]="item.link"
          routerLinkActive="is-active"
          [routerLinkActiveOptions]="{ exact: item.exact }"
          (click)="closeSidebar()"
        >
          <span class="material-icons">{{ item.icon }}</span>{{ item.label }}
        </a>
      }
    </nav>

    <a class="admin__back" routerLink="/">
      <span class="material-icons">public</span> View Website
    </a>
  </aside>

  <div class="admin__main">
    <header class="admin__topbar">
      <button type="button" class="admin__burger" (click)="toggleSidebar()" aria-label="Menu">
        <span class="material-icons">menu</span>
      </button>
      <span class="admin__topbar-title">Content Management</span>
      <a class="admin__topbar-user" routerLink="/">
        <span class="material-icons">account_circle</span> Admin
      </a>
    </header>

    <div class="admin__content">
      <router-outlet />
    </div>
  </div>

  @if (sidebarOpen()) {
    <div class="admin__scrim" (click)="closeSidebar()"></div>
  }
</div>
